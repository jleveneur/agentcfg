name: Release

# Push a tag such as v0.2.0, made by `npm version`, to publish that version.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    # Must match the environment named in the npm trusted publisher settings.
    environment: npm
    permissions:
      # The GitHub release.
      contents: write
      # npm trusted publishing: npm exchanges the workflow's OIDC token for a
      # one-time publish token, so no npm token is stored in the repository.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      # Also the npm that publishes: the runner's own npm (10.x) cannot do
      # trusted publishing.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
      - run: bun install --frozen-lockfile

      - name: Check the tag matches package.json
        run: |
          version="v$(node -p 'require("./package.json").version')"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json $version" >&2
            exit 1
          fi

      - run: bun run check
      # Built before npm reads package.json, so it finds the bin file.
      - run: bun run build

      # npm 11.5.1 or newer exchanges the workflow's OIDC token and attaches
      # provenance on its own. It comes with the Node set up above, so a Node
      # pin with an older npm fails here rather than at publish.
      - name: Check npm supports trusted publishing
        run: |
          npm --version
          node -e 'const [a, b, c] = process.argv[1].split(".").map(Number); process.exit(a > 11 || (a === 11 && (b > 5 || (b === 5 && c >= 1))) ? 0 : 1)' "$(npm --version)"

      - run: npm publish --access public

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes

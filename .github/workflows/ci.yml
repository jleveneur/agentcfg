name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push makes the previous run's answer irrelevant. `main` is exempt so the
# post-merge record stays complete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Bun installs and runs scripts (version from `packageManager`); the
      # scripts, tests, and CLI run on Node (version from `devEngines.runtime`).
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json

      - run: bun install --frozen-lockfile
      - run: bun run format:check
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test:unit
      - run: bun run build

      # Pull requests are squash-merged, so the title becomes the commit
      # message and has to satisfy commitlint.
      - name: Lint PR title
        if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: echo "$TITLE" | bunx commitlint

  test:
    name: Test (${{ matrix.os }})
    # Paths and app folders differ per OS: Claude Desktop and VS Code live in
    # ~/Library on macOS and %APPDATA% on Windows.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run test:unit

  package:
    name: Package on Node 22
    # The published package promises Node 22.13. Build with the toolchain, then
    # install the tarball the way a user would and run it on the oldest Node.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
      - run: bun install --frozen-lockfile
      # The tarball `npm publish` would upload, packed the same way.
      - run: npm pack --pack-destination "$RUNNER_TEMP"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.13.0

      - name: Install and run the tarball
        working-directory: ${{ runner.temp }}
        run: |
          node --version
          npm install --global ./jleveneur-agentcfg-*.tgz
          agentcfg --version
          agentcfg --help
          agentcfg scan

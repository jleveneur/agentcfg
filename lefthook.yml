# Git hooks. Fast on purpose: a slow hook gets bypassed with --no-verify, and
# CI is the real gate.

pre-commit:
  parallel: true
  jobs:
    - name: format
      glob: "*.{ts,js,mjs,json,jsonc,md,yaml,yml}"
      exclude:
        - "pnpm-lock.yaml"
      run: pnpm exec oxfmt {staged_files}
      stage_fixed: true

    - name: lint
      glob: "*.{ts,js,mjs}"
      # Syntax-only here. Type-aware lint needs the whole program and runs in
      # `pnpm check` and CI.
      run: pnpm exec oxlint {staged_files}

commit-msg:
  jobs:
    - name: commitlint
      run: pnpm exec commitlint --edit {1}

pre-push:
  parallel: true
  jobs:
    - name: typecheck
      run: pnpm typecheck

    - name: test
      run: pnpm test:unit
